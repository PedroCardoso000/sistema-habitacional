spring:
  application:
    name: esteira-habitacional-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/esteira_habitacional}
    username: ${DATABASE_USERNAME:esteira}
    password: ${DATABASE_PASSWORD:esteira}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: false
    runtime:
      verification-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: logstash

